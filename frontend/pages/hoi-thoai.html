<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/assets/img/icon-192.svg" />
    <link rel="stylesheet" href="/assets/css/main.css" />
    <title>Tin nhắn &amp; Hội thoại — TutorHub</title>
  </head>
  <body class="theme-user">
    <div id="khung-header"></div>

    <main class="container" style="padding: 1.5rem 1.25rem 3rem; max-width: 1120px">
      <div style="display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 1.15rem; flex-wrap: wrap; gap: 0.75rem">
        <div>
          <h1 style="margin: 0; font-size: 1.45rem; font-weight: 800; letter-spacing: -0.02em">Tin nhắn</h1>
          <p style="margin: 0.2rem 0 0; font-size: 0.85rem; color: var(--th-text-muted)">
            Trao đổi trực tiếp lộ trình học, mục tiêu và khung giờ phù hợp ngay trên TutorHub
          </p>
        </div>
        <div id="nut-ve-cong"></div>
      </div>

      <div id="hop-thong-bao" style="display: none"></div>

      <section class="chat-inbox-shell" aria-label="Hộp thư hội thoại">
        <aside class="chat-inbox-list" id="ds-hoi-thoai">
          <div style="padding: 1.25rem; font-size: 0.85rem; color: var(--th-text-muted)">Đang tải hội thoại...</div>
        </aside>

        <div class="chat-inbox-main" id="khung-noi-dung-chat">
          <div style="margin: auto; text-align: center; padding: 2rem; color: var(--th-text-muted); max-width: 340px">
            <div style="font-weight: 700; color: var(--th-text); margin-bottom: 0.35rem">Chọn một hội thoại</div>
            <div style="font-size: 0.84rem">
              Chọn gia sư hoặc học sinh ở cột bên trái để xem lịch sử tin nhắn và trò chuyện.
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="khung-footer"></div>

    <script type="module">
      import { api, layAccessToken } from '/assets/js/api.js';
      import { dinhDangNgayGioVn } from '/assets/js/dinh-dang.js';
      import { icons } from '/assets/js/icons.js';
      import {
        dongBoNguoiDungTuApi,
        escapeHtml,
        layChuCaiDau,
        layTrangChinhTheoVaiTro,
        renderFooter,
        renderHeader,
      } from '/assets/js/giao-dien.js';

      if (!layAccessToken()) {
        window.location.href = '/pages/dang-nhap.html';
      }

      renderHeader('#khung-header');
      renderFooter('#khung-footer');

      const user = await dongBoNguoiDungTuApi();
      renderHeader('#khung-header');

      if (user?.vaiTro === 'GIA_SU') {
        document.body.className = 'theme-tutor';
        document.getElementById('nut-ve-cong').innerHTML = `
          <a class="btn btn-primary btn-sm" href="/pages/quan-ly-gia-su.html">
            Về Cổng Gia sư ${icons.arrowRight(14)}
          </a>
        `;
      } else if (user?.vaiTro === 'HOC_SINH') {
        document.body.className = 'theme-user';
        document.getElementById('nut-ve-cong').innerHTML = `
          <a class="btn btn-secondary btn-sm" href="/pages/hoc-sinh-tong-quan.html">
            Về Cổng Học sinh ${icons.arrowRight(14)}
          </a>
        `;
      } else if (user) {
        const hop = document.getElementById('hop-thong-bao');
        hop.style.display = 'block';
        hop.className = 'alert alert-warning';
        hop.innerHTML = `Hộp thư nhắn tin dành cho Học sinh và Gia sư. <a href="${layTrangChinhTheoVaiTro(user.vaiTro)}" style="font-weight: 700">Về cổng của bạn →</a>`;
      }

      const urlParams = new URLSearchParams(window.location.search);
      let hoiThoaiDangMoId = urlParams.get('id') || '';
      const giaSuIdCanMo = urlParams.get('giaSuId') || '';
      let dsHoiThoai = [];
      let boDemTaiLai = null;

      async function khoiTao() {
        try {
          if (giaSuIdCanMo && user?.vaiTro === 'HOC_SINH') {
            const resMo = await api.post('/hoi-thoai', { giaSuId: giaSuIdCanMo });
            if (resMo?.duLieu?.id) {
              hoiThoaiDangMoId = resMo.duLieu.id;
            }
          }

          await taiDanhSachHoiThoai();
          if (hoiThoaiDangMoId) {
            await moHoiThoai(hoiThoaiDangMoId);
          } else if (dsHoiThoai.length > 0) {
            await moHoiThoai(dsHoiThoai[0].id);
          }

          boDemTaiLai = setInterval(() => {
            if (hoiThoaiDangMoId) {
              taiTinNhanImLang(hoiThoaiDangMoId);
            }
          }, 8000);
        } catch (err) {
          const hop = document.getElementById('hop-thong-bao');
          hop.style.display = 'block';
          hop.className = 'alert alert-danger';
          hop.textContent = err.message || 'Không thể tải danh sách hội thoại.';
        }
      }

      async function taiDanhSachHoiThoai() {
        const el = document.getElementById('ds-hoi-thoai');
        const res = await api.get('/hoi-thoai');
        dsHoiThoai = res?.duLieu || [];

        if (dsHoiThoai.length === 0) {
          el.innerHTML = `
            <div style="padding: 1.5rem 1.15rem; text-align: center; color: var(--th-text-muted); font-size: 0.84rem">
              <div style="font-weight: 700; color: var(--th-text); margin-bottom: 0.35rem">Chưa có tin nhắn nào</div>
              <p style="margin: 0 0 0.85rem">Bấm nút Nhắn tin trên hồ sơ gia sư để bắt đầu trao đổi.</p>
              <a class="btn btn-primary btn-sm" href="/pages/tim-kiem-gia-su.html">Tìm gia sư</a>
            </div>
          `;
          return;
        }

        el.innerHTML = dsHoiThoai
          .map((h) => {
            const active = h.id === hoiThoaiDangMoId ? 'active' : '';
            const anhHtml = h.anhDoiTac
              ? `<img src="${escapeHtml(h.anhDoiTac)}" alt="${escapeHtml(h.tenDoiTac)}" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0" />`
              : `<span class="avatar-circle" style="width: 40px; height: 40px; font-size: 0.82rem; flex-shrink: 0">${escapeHtml(layChuCaiDau(h.tenDoiTac))}</span>`;
            return `
              <button type="button" class="chat-inbox-item ${active}" data-id="${h.id}">
                ${anhHtml}
                <div style="min-width: 0; flex: 1">
                  <div style="display: flex; align-items: center; justify-content: space-between; gap: 0.35rem">
                    <strong style="font-size: 0.88rem; color: var(--th-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap">${escapeHtml(h.tenDoiTac)}</strong>
                    ${h.soChuaDoc > 0 ? `<span class="badge badge-info" style="font-size: 0.68rem; padding: 0.1rem 0.42rem">${h.soChuaDoc}</span>` : ''}
                  </div>
                  <div style="font-size: 0.77rem; color: var(--th-text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 0.15rem">
                    ${escapeHtml(h.tinNhanCuoi || 'Bắt đầu trò chuyện...')}
                  </div>
                </div>
              </button>
            `;
          })
          .join('');

        el.querySelectorAll('.chat-inbox-item').forEach((btn) => {
          btn.addEventListener('click', () => moHoiThoai(btn.dataset.id));
        });
      }

      function renderDanhSachTin(dsTin) {
        if (!dsTin || dsTin.length === 0) {
          return `
            <div style="margin: auto; text-align: center; font-size: 0.84rem; color: var(--th-text-muted); max-width: 280px">
              Hãy gửi lời chào và chia sẻ mục tiêu học tập để gia sư tư vấn lộ trình phù hợp nhất cho bạn!
            </div>
          `;
        }
        return dsTin
          .map(
            (t) => `
            <div class="th-chat-bubble ${t.laCuaToi ? 'mine' : 'theirs'}">
              <div>${escapeHtml(t.noiDung)}</div>
              ${t.biGanCo ? '<div class="th-chat-flag">Hệ thống đã ẩn thông tin liên hệ ngoài nền tảng để bảo vệ giao dịch an toàn.</div>' : ''}
              <div class="th-chat-time">${dinhDangNgayGioVn(t.taoLuc)}</div>
            </div>
          `
          )
          .join('');
      }

      async function moHoiThoai(id) {
        hoiThoaiDangMoId = id;
        document.querySelectorAll('.chat-inbox-item').forEach((b) => {
          b.classList.toggle('active', b.dataset.id === id);
        });

        const khung = document.getElementById('khung-noi-dung-chat');
        try {
          const res = await api.get(`/hoi-thoai/${id}`);
          const ct = res?.duLieu;
          if (!ct) return;

          const linkHoSo = ct.vaiTroDoiTac === 'GIA_SU'
            ? `<a href="/pages/ho-so-gia-su.html?id=${ct.doiTacId}" class="btn btn-secondary btn-sm" style="height: 32px; font-size: 0.78rem">Xem hồ sơ</a>`
            : '';

          khung.innerHTML = `
            <div class="th-chat-head" style="background: #ffffff">
              <div style="display: flex; align-items: center; gap: 0.65rem; min-width: 0">
                ${
                  ct.anhDoiTac
                    ? `<img src="${escapeHtml(ct.anhDoiTac)}" alt="${escapeHtml(ct.tenDoiTac)}" style="width: 38px; height: 38px; border-radius: 50%; object-fit: cover" />`
                    : `<span class="avatar-circle" style="width: 38px; height: 38px; font-size: 0.8rem">${escapeHtml(layChuCaiDau(ct.tenDoiTac))}</span>`
                }
                <div style="min-width: 0">
                  <div style="font-weight: 800; font-size: 0.94rem; color: var(--th-text)">${escapeHtml(ct.tenDoiTac)}</div>
                  <div style="font-size: 0.74rem; color: var(--th-text-muted)">Trao đổi an toàn trên TutorHub</div>
                </div>
              </div>
              ${linkHoSo}
            </div>

            <div class="th-chat-messages" id="vung-tin-nhan-chinh">
              ${renderDanhSachTin(ct.dsTinNhan)}
            </div>

            <form class="th-chat-composer" id="form-gui-tin-chinh">
              <input id="inp-tin-chinh" type="text" maxlength="2000" autocomplete="off" placeholder="Nhập tin nhắn trao đổi lịch học, mục tiêu..." required />
              <button type="submit" class="btn btn-primary btn-sm" style="height: 38px; padding: 0 1rem">
                ${icons.send(14)}
                <span>Gửi</span>
              </button>
            </form>
          `;

          const vungTin = document.getElementById('vung-tin-nhan-chinh');
          if (vungTin) vungTin.scrollTop = vungTin.scrollHeight;

          document.getElementById('form-gui-tin-chinh')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const inp = document.getElementById('inp-tin-chinh');
            const noiDung = inp?.value?.trim();
            if (!noiDung) return;
            inp.disabled = true;
            try {
              await api.post(`/hoi-thoai/${id}/tin-nhan`, { noiDung });
              inp.value = '';
              await moHoiThoai(id);
              await taiDanhSachHoiThoai();
            } catch (err) {
              alert(err.message);
            } finally {
              inp.disabled = false;
              inp.focus();
            }
          });
        } catch (err) {
          khung.innerHTML = `<div class="alert alert-danger" style="margin: 1rem">${escapeHtml(err.message)}</div>`;
        }
      }

      async function taiTinNhanImLang(id) {
        try {
          const res = await api.get(`/hoi-thoai/${id}`);
          const vung = document.getElementById('vung-tin-nhan-chinh');
          if (vung && res?.duLieu) {
            vung.innerHTML = renderDanhSachTin(res.duLieu.dsTinNhan);
          }
        } catch {
          // Bỏ qua lỗi mạng tạm thời
        }
      }

      window.addEventListener('beforeunload', () => {
        if (boDemTaiLai) clearInterval(boDemTaiLai);
      });

      khoiTao();
    </script>
  </body>
</html>
