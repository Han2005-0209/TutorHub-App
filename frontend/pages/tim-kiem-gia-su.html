<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/assets/img/icon-192.svg" />
    <link rel="stylesheet" href="/assets/css/main.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <title>Tìm kiếm Gia sư — TutorHub</title>
  </head>
  <body class="theme-user">
    <div id="khung-header"></div>

    <main class="container" style="padding: 1.75rem 1.25rem 3rem">
      <!-- Đầu trang + Bộ chuyển đổi hình thức học cố định (Không nhảy dòng) -->
      <div class="search-head-bar">
        <h1 style="margin: 0; font-size: 1.55rem; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; flex-shrink: 0">
          Tìm kiếm gia sư
        </h1>

        <div class="mode-switcher" role="tablist" aria-label="Chọn hình thức học">
          <button type="button" class="mode-pill active" data-mode="">Tất cả</button>
          <button type="button" class="mode-pill" data-mode="TRUC_TUYEN" id="pill-online">Học trực tuyến</button>
          <button type="button" class="mode-pill" data-mode="TRUC_TIEP" id="pill-offline">Học trực tiếp tại nhà</button>
        </div>
      </div>

      <!-- Thanh lọc tinh gọn (Trên PC dàn 3 cột ngang; trên Mobile dọc thu gọn thành 1 thanh tìm nhanh + ngăn kéo Bộ lọc) -->
      <form id="form-bo-loc" class="card search-filter-card" style="margin-bottom: 1.15rem; padding: 1.1rem 1.25rem">
        <div class="search-filter-top-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(185px, 1fr)); gap: 0.75rem">
          <div class="search-filter-field-keyword">
            <label class="form-label search-keyword-label" for="loc-tu-khoa">Từ khóa</label>
            <div class="search-mobile-keyword-row">
              <input id="loc-tu-khoa" type="text" class="form-control" list="ds-mon-hoc-goi-y" autocomplete="off" placeholder="Tìm môn học, tên gia sư..." />
              <button type="button" id="btn-mo-loc-mobile" class="btn btn-secondary btn-sm search-mobile-filter-btn" aria-expanded="false">
                Bộ lọc
              </button>
            </div>
            <datalist id="ds-mon-hoc-goi-y"></datalist>
          </div>
          <div class="search-filter-field-extra">
            <label class="form-label" for="loc-mon-hoc">Môn học</label>
            <select id="loc-mon-hoc" class="form-control">
              <option value="">Tất cả môn học</option>
            </select>
          </div>
          <div id="nhom-loc-khu-vuc" class="search-filter-field-extra">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.35rem">
              <label class="form-label" for="loc-khu-vuc" style="margin: 0">Khu vực (Học trực tiếp)</label>
              <button type="button" id="btn-gps-loc-nhanh" style="border: none; background: transparent; padding: 0; cursor: pointer; color: var(--th-blush-text); font-size: 0.78rem; font-weight: 700; display: inline-flex; align-items: center; gap: 0.25rem">
                <span>📍 Vị trí của tôi</span>
              </button>
            </div>
            <input id="loc-khu-vuc" type="text" class="form-control" list="ds-tinh-thanh-goi-y" placeholder="Cần Thơ, TP.HCM, Hà Nội..." />
            <datalist id="ds-tinh-thanh-goi-y"></datalist>
          </div>
        </div>

        <!-- Vùng bộ lọc nâng cao (thu gọn mặc định, mở khi bấm) -->
        <div
          id="vung-loc-nang-cao"
          class="search-filter-advanced"
          style="display: none; margin-top: 0.9rem; padding-top: 0.9rem; border-top: 1px solid #f1f5f9; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 0.75rem; align-items: end"
        >
          <div>
            <label class="form-label" for="loc-gia-toi-da">Học phí tối đa (₫/giờ)</label>
            <input id="loc-gia-toi-da" type="number" min="0" step="10000" class="form-control" placeholder="VD: 300000" />
          </div>
          <div>
            <label class="form-label" for="loc-sap-xep">Sắp xếp theo</label>
            <select id="loc-sap-xep" class="form-control">
              <option value="phu_hop">Phù hợp nhất</option>
              <option value="danh_gia">Đánh giá cao nhất</option>
              <option value="gia_tang">Học phí tăng dần</option>
              <option value="gia_giam">Học phí giảm dần</option>
              <option value="kinh_nghiem">Kinh nghiệm nhiều nhất</option>
            </select>
          </div>
          <div style="display: flex; align-items: center; padding-bottom: 0.4rem">
            <label style="display: inline-flex; align-items: center; gap: 0.45rem; font-size: 0.84rem; color: var(--th-text-secondary); cursor: pointer">
              <input id="loc-xac-minh" type="checkbox" />
              <span>Chỉ gia sư đã xác minh bằng cấp</span>
            </label>
          </div>
          <div style="display: flex; align-items: center; padding-bottom: 0.4rem">
            <label style="display: inline-flex; align-items: center; gap: 0.45rem; font-size: 0.84rem; color: var(--th-text-secondary); cursor: pointer">
              <input id="loc-hoc-thu" type="checkbox" />
              <span>Có mở buổi học thử</span>
            </label>
          </div>
        </div>

        <input id="loc-hinh-thuc" type="hidden" value="" />

        <div class="search-filter-actions-row" style="margin-top: 0.9rem; padding-top: 0.85rem; border-top: 1px solid #f1f5f9; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.65rem">
          <button id="btn-loc-nang-cao" type="button" class="btn btn-secondary btn-sm">
            Bộ lọc nâng cao
          </button>
          <div style="display: flex; gap: 0.5rem; flex: 1; justify-content: flex-end">
            <button id="btn-dat-lai" type="button" class="btn btn-ghost btn-sm">Đặt lại</button>
            <button type="submit" class="btn btn-primary btn-sm">Áp dụng bộ lọc</button>
          </div>
        </div>
      </form>

      <!-- Chip bộ lọc đang áp dụng -->
      <div id="khung-chip-loc" style="display: none; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; gap: 0.45rem"></div>

      <!-- Thanh công cụ kết quả: Số lượng + Chuyển đổi Danh sách / Bản đồ -->
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.75rem">
        <div id="mo-ta-ket-qua" style="font-size: 0.88rem; font-weight: 600; color: var(--th-text-secondary)">
          Đang tải danh sách gia sư...
        </div>

        <div id="cum-nut-che-do-xem" style="display: flex; align-items: center; gap: 0.4rem">
          <button id="btn-xem-danh-sach" type="button" class="btn btn-primary btn-sm">Danh sách</button>
          <button id="btn-xem-ban-do" type="button" class="btn btn-secondary btn-sm">Bản đồ khu vực</button>
        </div>
      </div>

      <!-- Bản đồ khu vực tinh gọn (1 thanh điều khiển duy nhất + Khung bản đồ) -->
      <section id="khung-ban-do" class="card" style="display: none; margin-bottom: 1.25rem; padding: 0.9rem 1rem">
        <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.65rem">
          <div id="txt-ban-kinh-hien-tai" style="font-size: 0.85rem; font-weight: 700; color: #334155">
            📍 Bản đồ toàn hệ thống · Bấm vào cụm tỉnh/thành để phóng to
          </div>
          <div style="display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap">
            <button type="button" class="btn btn-primary btn-sm" id="btn-mo-rong-ban-kinh" style="font-weight: 700">
              📍 Tìm gần vị trí của tôi (4 km)
            </button>
            <button type="button" class="btn btn-ghost btn-sm" id="btn-thu-hep-ban-kinh" style="display: none; font-weight: 600">
              ↺ Đặt lại 4 km
            </button>
          </div>
        </div>

        <!-- Cảnh báo ngắn gọn chỉ hiện khi học sinh mở rộng phạm vi từ 15km trở lên -->
        <div id="canh-bao-khoang-cach-xa" style="display: none; margin-bottom: 0.65rem; padding: 0.5rem 0.75rem; background: #fffbeb; border: 1px solid #fcd34d; border-radius: 8px; color: #92400e; font-size: 0.8rem">
          ⚠️ <strong>Phạm vi tìm kiếm đã khá xa (<span id="txt-muc-canh-bao-km">15 km</span>):</strong> Rất có thể gia sư sẽ không đồng ý di chuyển với quãng đường quá lớn (bạn vẫn có thể tìm thêm hoặc chọn học Trực tuyến).
        </div>

        <div id="ban-do-gia-su" style="height: 460px; width: 100%; border-radius: var(--th-radius-md); z-index: 1"></div>
      </section>

      <!-- Danh sách kết quả (Khung Skeleton 3 cột cố định khớp thẻ ảnh 372px chống giật trang) -->
      <div id="khung-ket-qua" class="grid-3" style="gap: 1.5rem">
        <div class="sk-sp-tutor-card" aria-hidden="true">
          <div class="sk-block sk-sp-tutor-media"></div>
          <div class="sk-sp-tutor-body">
            <span class="sk-line" style="height: 15px; width: 55%"></span>
            <span class="sk-line" style="height: 14px; width: 92%"></span>
            <span class="sk-line" style="height: 18px; width: 45%"></span>
          </div>
        </div>
        <div class="sk-sp-tutor-card" aria-hidden="true">
          <div class="sk-block sk-sp-tutor-media"></div>
          <div class="sk-sp-tutor-body">
            <span class="sk-line" style="height: 15px; width: 55%"></span>
            <span class="sk-line" style="height: 14px; width: 92%"></span>
            <span class="sk-line" style="height: 18px; width: 45%"></span>
          </div>
        </div>
        <div class="sk-sp-tutor-card" aria-hidden="true">
          <div class="sk-block sk-sp-tutor-media"></div>
          <div class="sk-sp-tutor-body">
            <span class="sk-line" style="height: 15px; width: 55%"></span>
            <span class="sk-line" style="height: 14px; width: 92%"></span>
            <span class="sk-line" style="height: 18px; width: 45%"></span>
          </div>
        </div>
      </div>

      <!-- Phân trang -->
      <div id="khung-phan-trang" style="display: flex; justify-content: center; gap: 0.5rem; margin-top: 1.75rem"></div>
    </main>

    <div id="khung-footer"></div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module">
      import { api } from '/assets/js/api.js';
      import { ganChuQuyenBienDaoVietNam } from '/assets/js/ban-do-viet-nam.js';
      import { dinhDangTienVnd } from '/assets/js/dinh-dang.js';
      import { icons } from '/assets/js/icons.js';
      import { DS_TINH_THANH_VIET_NAM } from '/assets/js/dia-diem-vn.js';
      import { taoOptionsNhomMonHocHtml } from '/assets/js/mon-hoc-goi-y.js';
      import {
        dongBoNguoiDungTuApi,
        escapeHtml,
        layAnhGiaSu,
        layNguoiDungHienTai,
        renderCardGiaSu,
        renderFooter,
        renderHeader,
        taoSkeletonCardGiaSu,
      } from '/assets/js/giao-dien.js';
      import { hienToast } from '/assets/js/thong-bao-ui.js';

      renderHeader('#khung-header');
      renderFooter('#khung-footer');
      dongBoNguoiDungTuApi().then(() => renderHeader('#khung-header'));

      const dlKhuVuc = document.getElementById('ds-tinh-thanh-goi-y');
      if (dlKhuVuc) {
        dlKhuVuc.innerHTML = DS_TINH_THANH_VIET_NAM.map((t) => `<option value="${escapeHtml(t.ten)}"></option>`).join('');
      }

      // Gắn icon SVG gọn gàng vào nút
      document.getElementById('pill-online').innerHTML = `${icons.video(14)} <span>Học trực tuyến</span>`;
      document.getElementById('pill-offline').innerHTML = `${icons.home(14)} <span>Trực tiếp tại nhà</span>`;
      document.getElementById('btn-loc-nang-cao').innerHTML = `${icons.sliders(14)} <span>Bộ lọc nâng cao</span>`;
      document.getElementById('btn-xem-danh-sach').innerHTML = `${icons.list(14)} <span>Danh sách</span>`;
      document.getElementById('btn-xem-ban-do').innerHTML = `${icons.map(14)} <span>Bản đồ khu vực</span>`;
      const elIcoLocate = document.getElementById('ico-locate-btn');
      if (elIcoLocate) elIcoLocate.innerHTML = icons.locate(15);

      const urlParams = new URLSearchParams(window.location.search);
      let trangHienTai = Number(urlParams.get('trang')) || 1;
      let cheDoXem = urlParams.get('hinhThuc') === 'TRUC_TIEP' ? 'ban_do' : 'danh_sach';
      let dangMoNangCao = Boolean(
        urlParams.get('giaToiDa') ||
          urlParams.get('chiDaXacMinh') === 'true' ||
          urlParams.get('coHocThu') === 'true'
      );
      // Các bước mở rộng phạm vi tìm kiếm tuần tự: 4km -> 8km -> 15km (bắt đầu cảnh báo xa) -> 25km (cảnh báo xa) -> 0 (Toàn khu vực)
      const CAC_BUOC_PHAM_VI_KM = [4, 8, 15, 25, 0];

      let banDo = null;
      let lopMarker = null;
      let lopViTriBanThan = null;
      let viTriHienTaiToaDo = null;
      let banKinhQuetKm = 4; // Mặc định tìm trong phạm vi gần nhất (4 km) trước
      let dsMonHoc = [];
      let dsGiaSuHienTai = [];
      let dsGiaSuBanDo = [];
      let dangZoomTuCode = false;

      function layBuocPhamViTiepTheo(kmHienTai) {
        const idx = CAC_BUOC_PHAM_VI_KM.indexOf(kmHienTai);
        if (idx === -1) return 8;
        if (idx >= CAC_BUOC_PHAM_VI_KM.length - 1) return null;
        return CAC_BUOC_PHAM_VI_KM[idx + 1];
      }

      function dinhDangNhanPhamVi(km) {
        if (km === 0) return 'Toàn khu vực (Không giới hạn km)';
        if (km <= 4) return `${km} km gần bạn nhất`;
        if (km >= 15) return `${km} km (Phạm vi xa)`;
        return `${km} km quanh bạn`;
      }

      function capNhatGiaoDienPhamViQuet() {
        const txtBk = document.getElementById('txt-ban-kinh-hien-tai');
        const btnMoRong = document.getElementById('btn-mo-rong-ban-kinh');
        const btnThuHep = document.getElementById('btn-thu-hep-ban-kinh');
        const hopCanhBao = document.getElementById('canh-bao-khoang-cach-xa');
        const txtMucCanhBao = document.getElementById('txt-muc-canh-bao-km');

        if (txtBk) {
          const kv = document.getElementById('loc-khu-vuc')?.value?.trim() || 'Cần Thơ';
          txtBk.textContent = viTriHienTaiToaDo
            ? `📍 Tâm quét: ${kv} · Phạm vi ${dinhDangNhanPhamVi(banKinhQuetKm)}`
            : '📍 Bản đồ toàn hệ thống · Bấm vào cụm tỉnh/thành để phóng to';
        }

        const buocTiep = layBuocPhamViTiepTheo(banKinhQuetKm);
        const laPhamViXa = viTriHienTaiToaDo && (banKinhQuetKm >= 15 || banKinhQuetKm === 0);

        if (hopCanhBao) {
          hopCanhBao.style.display = laPhamViXa ? 'block' : 'none';
          if (txtMucCanhBao) {
            txtMucCanhBao.textContent = banKinhQuetKm === 0 ? 'Toàn khu vực' : `${banKinhQuetKm} km`;
          }
        }

        if (btnThuHep) {
          btnThuHep.style.display = viTriHienTaiToaDo && banKinhQuetKm !== 4 ? 'inline-flex' : 'none';
        }

        if (btnMoRong) {
          if (!viTriHienTaiToaDo) {
            btnMoRong.style.display = 'inline-flex';
            btnMoRong.textContent = '📍 Tìm gần vị trí của tôi (4 km)';
          } else if (buocTiep === null) {
            btnMoRong.style.display = 'none';
          } else {
            btnMoRong.style.display = 'inline-flex';
            const nhanBuocTiep = buocTiep === 0 ? 'Toàn khu vực' : `${buocTiep} km`;
            btnMoRong.textContent = `+ Tìm thêm ở xa hơn (${nhanBuocTiep})`;
          }
        }
      }

      function moRongPhamViTimKiem() {
        if (!viTriHienTaiToaDo) {
          kichHoatTimQuanhDay();
          return;
        }
        const buocTiep = layBuocPhamViTiepTheo(banKinhQuetKm);
        if (buocTiep === null) return;
        banKinhQuetKm = buocTiep;
        capNhatGiaoDienPhamViQuet();
        veViTriCuaBan(
          viTriHienTaiToaDo.lat,
          viTriHienTaiToaDo.lng,
          banKinhQuetKm,
          document.getElementById('loc-khu-vuc')?.value || 'Cần Thơ',
          false
        );
        timKiem(1);
      }

      function thuHepVeGanToi() {
        banKinhQuetKm = 4;
        capNhatGiaoDienPhamViQuet();
        if (viTriHienTaiToaDo) {
          veViTriCuaBan(
            viTriHienTaiToaDo.lat,
            viTriHienTaiToaDo.lng,
            banKinhQuetKm,
            document.getElementById('loc-khu-vuc')?.value || 'Cần Thơ',
            false
          );
        }
        timKiem(1);
      }

      function tinhKhoangCachKm(lat1, lon1, lat2, lon2) {
        const R = 6371; // km
        const dLat = ((lat2 - lat1) * Math.PI) / 180;
        const dLon = ((lon2 - lon1) * Math.PI) / 180;
        const a =
          Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos((lat1 * Math.PI) / 180) * Math.cos((lat2 * Math.PI) / 180) *
          Math.sin(dLon / 2) * Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
      }

      function khoiTaoBanDo() {
        if (typeof window.L === 'undefined' || banDo) return;
        banDo = window.L.map('ban-do-gia-su', {
          center: [15.5, 108.5],
          zoom: 5,
          minZoom: 4,
          maxZoom: 18,
          zoomControl: true,
        });
        window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          minZoom: 4,
          maxZoom: 18,
          attribution: '&copy; Bản đồ khu vực giảng dạy TutorHub',
        }).addTo(banDo);
        lopMarker = window.L.layerGroup().addTo(banDo);
        lopViTriBanThan = window.L.layerGroup().addTo(banDo);
        ganChuQuyenBienDaoVietNam(banDo);

        // Tự động vẽ lại lớp ghim theo mức zoom:
        // - Zoom xa (<= 10): Gom cụm theo Tỉnh/Khu vực (Cần Thơ: 63 gia sư...), ẩn hoàn toàn số tiền
        // - Zoom vừa (11-12): Gom cụm nhỏ nếu chồng nhau + ẩn thẻ số tiền để không đè nhau
        // - Zoom gần (>= 13): Khoảng cách giữa các ghim đã thoáng -> hiển thị đầy đủ ảnh + khoảng cách + học phí
        banDo.on('zoomend', () => {
          if (dangZoomTuCode) return;
          if (dsGiaSuBanDo.length > 0) {
            veLaiLopMarkerTheoZoom(dsGiaSuBanDo, false);
          }
        });
      }

      function veViTriCuaBan(lat, lng, banKinhKm = 4, tenKhuVuc = 'Cần Thơ', capNhatKhungNhin = true) {
        khoiTaoBanDo();
        if (!banDo || !lopViTriBanThan) return;
        banDo.invalidateSize();
        lopViTriBanThan.clearLayers();

        const banKinhMet = banKinhKm > 0 ? banKinhKm * 1000 : 0;
        let vongTronQuet = null;

        // Vòng tròn radar bán kính quét quanh HỌC SINH (chỉ vẽ 1 vòng duy nhất, nét thanh nhẹ để không rối mắt)
        if (banKinhMet > 0) {
          vongTronQuet = window.L.circle([lat, lng], {
            radius: banKinhMet,
            color: '#e11d48',
            fillColor: '#fda4af',
            fillOpacity: 0.06,
            weight: 1.8,
            dashArray: '6, 6',
            interactive: false,
          }).addTo(lopViTriBanThan);
        }

        const iconBanThan = window.L.divIcon({
          className: 'custom-user-marker',
          html: `
            <div class="user-gps-pulse-wrap">
              <div class="user-gps-pulse-ring"></div>
              <div class="user-gps-dot">📍</div>
            </div>
          `,
          iconSize: [36, 36],
          iconAnchor: [18, 18],
          popupAnchor: [0, -18],
        });

        const txtBk = banKinhKm > 0 ? `Bán kính quét: <strong>${banKinhKm} km</strong>` : 'Phạm vi: <strong>Toàn khu vực</strong>';
        window.L.marker([lat, lng], { icon: iconBanThan, zIndexOffset: 1000 })
          .bindPopup(
            `<div style="font-weight: 700; font-size: 0.94rem; color: #1e293b">📍 Vị trí của bạn (Tâm quét)</div>
             <div style="font-size: 0.82rem; color: #64748b; margin-top: 3px">Khu vực: ${escapeHtml(tenKhuVuc)}</div>
             <div style="font-size: 0.8rem; color: #c24752; font-weight: 700; margin-top: 3px">🎯 ${txtBk}</div>
             <div style="font-size: 0.76rem; color: #15803d; font-weight: 600; margin-top: 2px">Đang quét tìm các gia sư có thể học được quanh đây</div>`,
            { autoPan: false }
          )
          .addTo(lopViTriBanThan);

        if (capNhatKhungNhin) {
          if (vongTronQuet && banKinhKm <= 8) {
            banDo.fitBounds(vongTronQuet.getBounds(), { padding: [35, 35], maxZoom: 14 });
          } else {
            banDo.setView([lat, lng], 13, { animate: true });
          }
        }
      }

      function kichHoatTimQuanhDay() {
        const btnTimQuanh = document.getElementById('btn-tim-quanh-day');
        const inpKhuVuc = document.getElementById('loc-khu-vuc');

        if (btnTimQuanh) {
          btnTimQuanh.disabled = true;
          btnTimQuanh.innerHTML = `<span>Đang xác định GPS...</span>`;
        }

        // Luôn bắt đầu tìm từ phạm vi gần nhất (4 km) rồi học sinh muốn mới bấm mở rộng dần
        banKinhQuetKm = 4;
        cheDoXem = 'ban_do';
        capNhatGiaoDienTheoHinhThuc('TRUC_TIEP');

        const xuLyToaDo = (lat, lng) => {
          viTriHienTaiToaDo = { lat, lng };

          let tenKhuVuc = 'Cần Thơ';
          if (lat >= 9.8 && lat <= 10.3 && lng >= 105.4 && lng <= 106.0) tenKhuVuc = 'Cần Thơ';
          else if (lat >= 10.5 && lat <= 11.2 && lng >= 106.4 && lng <= 107.1) tenKhuVuc = 'TP.HCM';
          else if (lat >= 20.8 && lat <= 21.4 && lng >= 105.6 && lng <= 106.1) tenKhuVuc = 'Hà Nội';
          else if (lat >= 15.8 && lat <= 16.3 && lng >= 108.0 && lng <= 108.4) tenKhuVuc = 'Đà Nẵng';
          else if (lat >= 20.6 && lat <= 21.0 && lng >= 106.5 && lng <= 107.0) tenKhuVuc = 'Hải Phòng';
          else if (lat >= 10.8 && lat <= 11.3 && lng >= 106.5 && lng <= 107.1) tenKhuVuc = 'Bình Dương';

          if (inpKhuVuc) {
            inpKhuVuc.value = tenKhuVuc;
          }

          capNhatGiaoDienPhamViQuet();
          veViTriCuaBan(lat, lng, banKinhQuetKm, tenKhuVuc);

          if (btnTimQuanh) {
            btnTimQuanh.disabled = false;
            btnTimQuanh.innerHTML = `${icons.locate(14)} <span>Vị trí của tôi: ${escapeHtml(tenKhuVuc)}</span>`;
          }

          timKiem(1);
        };

        if (!navigator.geolocation) {
          xuLyToaDo(10.0092, 105.7244); // Mặc định quanh P. An Bình / ĐH Nam Cần Thơ, Q. Ninh Kiều, Cần Thơ
          return;
        }

        navigator.geolocation.getCurrentPosition(
          (pos) => {
            xuLyToaDo(pos.coords.latitude, pos.coords.longitude);
          },
          (err) => {
            console.warn('Geolocation error / fallback Cần Thơ:', err);
            xuLyToaDo(10.0092, 105.7244);
          },
          { timeout: 5000, enableHighAccuracy: true }
        );
      }

      function dongBoBoLocNangCao() {
        const el = document.getElementById('vung-loc-nang-cao');
        el.style.display = dangMoNangCao ? 'grid' : 'none';
      }

      function dongBoCheDoXem() {
        const hinhThuc = document.getElementById('loc-hinh-thuc').value;
        const khungBanDo = document.getElementById('khung-ban-do');
        const btnDs = document.getElementById('btn-xem-danh-sach');
        const btnBd = document.getElementById('btn-xem-ban-do');
        const cumNut = document.getElementById('cum-nut-che-do-xem');

        if (hinhThuc === 'TRUC_TUYEN') {
          cumNut.style.display = 'none';
          khungBanDo.style.display = 'none';
          return;
        }

        cumNut.style.display = 'flex';
        const hienBanDo = cheDoXem === 'ban_do';
        khungBanDo.style.display = hienBanDo ? 'block' : 'none';
        btnDs.className = `btn btn-sm ${!hienBanDo ? 'btn-primary' : 'btn-secondary'}`;
        btnBd.className = `btn btn-sm ${hienBanDo ? 'btn-primary' : 'btn-secondary'}`;

        if (hienBanDo) {
          khoiTaoBanDo();
          setTimeout(() => {
            banDo?.invalidateSize();
            const nguon = dsGiaSuBanDo.length > 0 ? dsGiaSuBanDo : dsGiaSuHienTai;
            capNhatMarkerBanDo(nguon);
          }, 120);
        }
      }

      function capNhatGiaoDienTheoHinhThuc(hinhThuc) {
        document.getElementById('loc-hinh-thuc').value = hinhThuc || '';
        document.querySelectorAll('.mode-pill').forEach((btn) => {
          btn.classList.toggle('active', (btn.dataset.mode || '') === (hinhThuc || ''));
        });

        const inpKhuVuc = document.getElementById('loc-khu-vuc');

        if (hinhThuc === 'TRUC_TUYEN') {
          inpKhuVuc.disabled = true;
          inpKhuVuc.placeholder = 'Áp dụng toàn quốc (không giới hạn khu vực)';
          cheDoXem = 'danh_sach';
        } else if (hinhThuc === 'TRUC_TIEP') {
          inpKhuVuc.disabled = false;
          inpKhuVuc.placeholder = 'Cần Thơ, TP.HCM, Hà Nội...';
          cheDoXem = 'ban_do';
        } else {
          inpKhuVuc.disabled = false;
          inpKhuVuc.placeholder = 'Cần Thơ, TP.HCM, Hà Nội...';
        }

        dongBoCheDoXem();
      }

      let vongTronGiaSuDangChon = null;
      let dsDiemHienTaiTrenBanDo = [];

      function canKhungToanBoGiaSu() {
        if (!banDo) return;
        banDo.closePopup();
        if (viTriHienTaiToaDo && dsDiemHienTaiTrenBanDo.length > 0) {
          const diemBaoGomBan = [[viTriHienTaiToaDo.lat, viTriHienTaiToaDo.lng], ...dsDiemHienTaiTrenBanDo];
          banDo.fitBounds(diemBaoGomBan, { padding: [56, 56], maxZoom: 14, animate: true });
        } else if (dsDiemHienTaiTrenBanDo.length === 1) {
          banDo.setView(dsDiemHienTaiTrenBanDo[0], 13, { animate: true });
        } else if (dsDiemHienTaiTrenBanDo.length > 1) {
          banDo.fitBounds(dsDiemHienTaiTrenBanDo, { padding: [52, 52], maxZoom: 13, animate: true });
        }
      }

      function canGiuaMarkerKemPopup(lat, lng) {
        if (!banDo) return;
        dangZoomTuCode = true;
        const targetZoom = Math.max(banDo.getZoom() || 13, 14);
        const diemPx = banDo.project([lat, lng], targetZoom);
        diemPx.y -= 95;
        const tamMoi = banDo.unproject(diemPx, targetZoom);
        banDo.setView(tamMoi, targetZoom, { animate: true, duration: 0.45 });
        setTimeout(() => {
          dangZoomTuCode = false;
        }, 550);
      }

      function tachToaDoChongDe(latGoc, lngGoc, dsDaDat) {
        let lat = latGoc;
        let lng = lngGoc;
        const khoangCachToiThieuDo = 0.0068; // ~730m để các avatar tách thoáng khi zoom vào phường/quận
        let buoc = 1;
        while (
          buoc <= 48 &&
          dsDaDat.some((p) => Math.hypot(p[0] - lat, p[1] - lng) < khoangCachToiThieuDo)
        ) {
          const gocRad = buoc * 2.399963229728653; // Golden angle ~137.508 độ
          const banKinhDo = 0.0056 * Math.sqrt(buoc);
          lat = Number((latGoc + Math.sin(gocRad) * banKinhDo).toFixed(4));
          lng = Number((lngGoc + Math.cos(gocRad) * banKinhDo).toFixed(4));
          buoc += 1;
        }
        dsDaDat.push([lat, lng]);
        return [lat, lng];
      }

      function trichTenTinhThanh(khuVuc = '') {
        const s = String(khuVuc || '').trim();
        if (!s) return 'Khu vực';
        const parts = s.split(',').map((x) => x.trim()).filter(Boolean);
        return parts.length > 0 ? parts[parts.length - 1] : s;
      }

      function capNhatMarkerBanDo(dsGiaSu) {
        dsGiaSuBanDo = Array.isArray(dsGiaSu) ? dsGiaSu : [];
        veLaiLopMarkerTheoZoom(dsGiaSuBanDo, true);
      }

      function veLaiLopMarkerTheoZoom(dsGiaSu, canKhungTuDong = false) {
        if (!banDo || !lopMarker) return;
        lopMarker.clearLayers();
        vongTronGiaSuDangChon = null;

        const dsHopLe = [];
        const dsToaDoDaDat = [];
        let soTrongPhamVi = 0;
        let soSanSangDenNha = 0;

        dsGiaSu.forEach((gs) => {
          if (gs.coDayTrucTiep && typeof gs.viDoMo === 'number' && typeof gs.kinhDoMo === 'number') {
            let d = null;
            let trongPhamViQuet = true;
            let sanSangDenNha = true;

            if (viTriHienTaiToaDo) {
              d = tinhKhoangCachKm(viTriHienTaiToaDo.lat, viTriHienTaiToaDo.lng, gs.viDoMo, gs.kinhDoMo);
              gs._khoangCachKm = d;
              const bkGs = gs.banKinhPhucVuKm || 10;
              sanSangDenNha = d <= bkGs;
              gs._sanSangDenNha = sanSangDenNha;

              if (banKinhQuetKm > 0 && d > banKinhQuetKm) {
                trongPhamViQuet = false;
              }
            }

            if (!trongPhamViQuet) return;

            soTrongPhamVi += 1;
            if (sanSangDenNha) soSanSangDenNha += 1;
            const [viDoHienThi, kinhDoHienThi] = tachToaDoChongDe(gs.viDoMo, gs.kinhDoMo, dsToaDoDaDat);
            dsHopLe.push({
              gs,
              d,
              sanSangDenNha,
              viDoHienThi,
              kinhDoHienThi,
            });
          }
        });

        const diem = dsHopLe.map((x) => [x.viDoHienThi, x.kinhDoHienThi]);
        dsDiemHienTaiTrenBanDo = diem;

        // Nếu vừa nạp dữ liệu mới, căn khung nhìn bản đồ trước rồi lấy mức zoom thực tế để quyết định Gom cụm hay Hiển thị chi tiết
        if (canKhungTuDong) {
          dangZoomTuCode = true;
          if (viTriHienTaiToaDo) {
            veViTriCuaBan(
              viTriHienTaiToaDo.lat,
              viTriHienTaiToaDo.lng,
              banKinhQuetKm,
              document.getElementById('loc-khu-vuc')?.value || 'Cần Thơ',
              diem.length === 0
            );
            if (diem.length > 0) {
              const diemBaoGomBan = [[viTriHienTaiToaDo.lat, viTriHienTaiToaDo.lng], ...diem];
              banDo.fitBounds(diemBaoGomBan, { padding: [52, 52], maxZoom: 14, animate: false });
            }
          } else if (diem.length === 1) {
            banDo.setView(diem[0], 13, { animate: false });
          } else if (diem.length > 1) {
            banDo.fitBounds(diem, { padding: [48, 48], maxZoom: 13, animate: false });
          }
          setTimeout(() => {
            dangZoomTuCode = false;
          }, 150);
        }

        const mucZoomHienTai = banDo.getZoom() || 12;
        // Chỉ hiển thị nhãn số tiền (210k) khi zoom đủ gần (zoom >= 13) để các ghim có khoảng cách thoáng, không đè nhau!
        const hienThiSoTien = mucZoomHienTai >= 13;

        // Gom cụm theo khoảng cách pixel trên màn hình khi zoom xa / vừa (zoom <= 12)
        // - Zoom <= 10 (Toàn quốc / Vùng miền): Gom theo Tỉnh/Thành hoặc bán kính 78px
        // - Zoom 11..12 (Thành phố / Quận): Gom các ghim nằm quá sát nhau (< 46px) thành cụm nhỏ, các ghim tách rời thì chỉ hiện ảnh tròn gọn (không hiện số tiền)
        const banKinhGomCumPx = mucZoomHienTai <= 10 ? 78 : mucZoomHienTai <= 12 ? 44 : 0;
        const dsCum = [];

        dsHopLe.forEach((item) => {
          const pt = banDo.latLngToContainerPoint([item.viDoHienThi, item.kinhDoHienThi]);
          const tenTinh = trichTenTinhThanh(item.gs.khuVuc);
          let cumTimThay = null;

          if (banKinhGomCumPx > 0) {
            for (const c of dsCum) {
              const khoangCachPx = Math.hypot(c.centerPx.x - pt.x, c.centerPx.y - pt.y);
              const cungTinhKhiZoomXa = mucZoomHienTai <= 9 && c.tenTinh === tenTinh && khoangCachPx < 135;
              if (khoangCachPx < banKinhGomCumPx || cungTinhKhiZoomXa) {
                cumTimThay = c;
                break;
              }
            }
          }

          if (cumTimThay) {
            cumTimThay.items.push(item);
            const n = cumTimThay.items.length;
            cumTimThay.lat = (cumTimThay.lat * (n - 1) + item.viDoHienThi) / n;
            cumTimThay.lng = (cumTimThay.lng * (n - 1) + item.kinhDoHienThi) / n;
            cumTimThay.centerPx = banDo.latLngToContainerPoint([cumTimThay.lat, cumTimThay.lng]);
          } else {
            dsCum.push({
              lat: item.viDoHienThi,
              lng: item.kinhDoHienThi,
              centerPx: pt,
              tenTinh,
              items: [item],
            });
          }
        });

        dsCum.forEach((cum) => {
          // Nếu cụm có từ 2 gia sư trở lên khi đang ở mức zoom xa/vừa -> Vẽ Ghim Cụm Khu Vực (KHÔNG hiển thị số tiền, bấm vào tự zoom thẳng vào cụm đó!)
          if (cum.items.length > 1 && banKinhGomCumPx > 0) {
            const gsDaiDien = cum.items[0].gs;
            const anhUrl = layAnhGiaSu(gsDaiDien);
            const soLuong = cum.items.length;
            const hienNhanTinh = mucZoomHienTai <= 10;
            const thanhNhanTinhHtml = hienNhanTinh
              ? `<div class="tutor-pin-tag" style="background: #0f172a; color: #fff; padding: 2px 8px; font-weight: 700; white-space: nowrap">
                   <span>${escapeHtml(cum.tenTinh)}</span>
                 </div>`
              : '';

            const iconCum = window.L.divIcon({
              className: 'custom-tutor-cluster-marker',
              html: `
                <div class="tutor-map-pin ready-travel" title="Bấm để phóng to xem ${soLuong} gia sư tại ${escapeHtml(cum.tenTinh)}" style="cursor: pointer">
                  <div class="tutor-pin-avatar-wrap" style="position: relative; border-width: 3px">
                    <img src="${escapeHtml(anhUrl)}" class="tutor-pin-img" alt="${escapeHtml(cum.tenTinh)}" />
                    <span style="position: absolute; top: -6px; right: -10px; background: #c24752; color: #fff; font-size: 0.72rem; font-weight: 800; padding: 1px 6px; border-radius: 999px; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.2)">+${soLuong}</span>
                  </div>
                  ${thanhNhanTinhHtml}
                  <div class="tutor-pin-pointer"></div>
                </div>
              `,
              iconSize: hienNhanTinh ? [90, 72] : [50, 56],
              iconAnchor: hienNhanTinh ? [45, 72] : [25, 56],
            });

            const markerCum = window.L.marker([cum.lat, cum.lng], { icon: iconCum, zIndexOffset: 500 }).addTo(lopMarker);
            markerCum.on('click', () => {
              const dsToaDoCum = cum.items.map((x) => [x.viDoHienThi, x.kinhDoHienThi]);
              const zoomMucTieu = mucZoomHienTai <= 10 ? 13 : 14;
              banDo.fitBounds(dsToaDoCum, { padding: [55, 55], maxZoom: zoomMucTieu, animate: true });
            });
            return;
          }

          // Trường hợp 1 gia sư riêng lẻ
          const { gs, d, sanSangDenNha, viDoHienThi, kinhDoHienThi } = cum.items[0];
          let textKhoangCach = '';
          if (d !== null) {
            textKhoangCach = `
              <div style="margin-top: 4px; padding: 4px 6px; background: #f0fdf4; border-radius: 6px; font-size: 0.8rem">
                <span style="color: #059669; font-weight: 700">📍 Cách bạn: ${d.toFixed(1)} km</span><br/>
                ${sanSangDenNha ? '<span style="color: #15803d; font-weight: 600">✓ Gia sư sẵn sàng đến tận nhà bạn</span>' : `<span style="color: #d97706; font-weight: 600">⚠️ Bán kính nhận dạy của gia sư: ${gs.banKinhPhucVuKm} km (Xa hơn phạm vi nhận dạy)</span>`}
              </div>
            `;
          }

          const anhUrl = layAnhGiaSu(gs);
          const giaK = Math.round(gs.giaThapNhat / 1000);
          const tagKhoangCachHtml = d !== null ? `<span class="tutor-pin-dist">${d.toFixed(1)} km</span>` : '';

          // Khi zoom xa/vừa (mucZoomHienTai < 13), ẩn thanh giá tiền để bản đồ gọn thoáng; chỉ hiện số tiền khi zoom >= 13
          const thanhGiaHtml = hienThiSoTien
            ? `<div class="tutor-pin-tag">
                 ${tagKhoangCachHtml}
                 <span class="tutor-pin-price">${giaK}k</span>
               </div>`
            : '';

          const iconGiaSu = window.L.divIcon({
            className: 'custom-tutor-avatar-marker',
            html: `
              <div class="tutor-map-pin ${sanSangDenNha ? 'ready-travel' : ''}" title="${escapeHtml(gs.hoTen)} — Bấm để xem chi tiết">
                <div class="tutor-pin-avatar-wrap">
                  <img src="${escapeHtml(anhUrl)}" class="tutor-pin-img" alt="${escapeHtml(gs.hoTen)}" />
                  ${gs.daXacMinh ? '<span class="tutor-pin-badge">✓</span>' : ''}
                </div>
                ${thanhGiaHtml}
                <div class="tutor-pin-pointer"></div>
              </div>
            `,
            iconSize: hienThiSoTien ? [60, 72] : [46, 54],
            iconAnchor: hienThiSoTien ? [30, 72] : [23, 54],
            popupAnchor: hienThiSoTien ? [0, -72] : [0, -54],
          });

          const markerGs = window.L.marker([viDoHienThi, kinhDoHienThi], { icon: iconGiaSu })
            .bindPopup(
              `<div style="display: flex; gap: 0.65rem; align-items: center; min-width: 230px">
                 <img src="${escapeHtml(anhUrl)}" style="width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex-shrink: 0; box-shadow: 0 2px 6px rgba(0,0,0,0.15)" alt="${escapeHtml(gs.hoTen)}" />
                 <div>
                   <div style="font-weight: 700; font-size: 0.95rem; color: #1e293b">${escapeHtml(gs.hoTen)}</div>
                   <div style="font-size: 0.8rem; color: #64748b; margin-top: 1px">${escapeHtml(gs.khuVuc || '')} · Bán kính ${gs.banKinhPhucVuKm} km</div>
                 </div>
               </div>
               ${textKhoangCach}
               <div style="font-size: 0.84rem; font-weight: 700; color: #c24752; margin-top: 5px">Học phí: ${dinhDangTienVnd(gs.giaThapNhat)}/giờ</div>
               <div style="margin-top: 6px; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem">
                 <a href="/pages/ho-so-gia-su.html?id=${gs.id}" style="color: #c24752; font-weight: 700; text-decoration: underline">Xem hồ sơ chi tiết →</a>
               </div>`,
              { autoPan: false, closeButton: true }
            )
            .addTo(lopMarker);

          const hienVongTronGiaSu = () => {
            if (vongTronGiaSuDangChon) {
              lopMarker.removeLayer(vongTronGiaSuDangChon);
              vongTronGiaSuDangChon = null;
            }
            if (gs.banKinhPhucVuKm > 0) {
              vongTronGiaSuDangChon = window.L.circle([viDoHienThi, kinhDoHienThi], {
                radius: gs.banKinhPhucVuKm * 1000,
                color: sanSangDenNha ? '#10b981' : '#94a3b8',
                fillColor: sanSangDenNha ? '#34d399' : '#cbd5e1',
                fillOpacity: 0.08,
                weight: 1.5,
                dashArray: '5, 5',
                interactive: false,
              }).addTo(lopMarker);
            }
          };

          const anVongTronGiaSu = () => {
            if (markerGs.isPopupOpen()) return;
            if (vongTronGiaSuDangChon) {
              lopMarker.removeLayer(vongTronGiaSuDangChon);
              vongTronGiaSuDangChon = null;
            }
          };

          markerGs.on('mouseover', hienVongTronGiaSu);
          markerGs.on('mouseout', anVongTronGiaSu);
          markerGs.on('popupopen', () => {
            markerGs.setZIndexOffset(2500);
            hienVongTronGiaSu();
            canGiuaMarkerKemPopup(viDoHienThi, kinhDoHienThi);
          });
          markerGs.on('popupclose', () => {
            markerGs.setZIndexOffset(0);
            if (vongTronGiaSuDangChon) {
              lopMarker.removeLayer(vongTronGiaSuDangChon);
              vongTronGiaSuDangChon = null;
            }
          });
        });

        const chuThich = document.getElementById('chu-thich-ban-do');
        if (chuThich) {
          if (viTriHienTaiToaDo) {
            const txtBk = banKinhQuetKm > 0 ? `phạm vi <strong>${banKinhQuetKm} km</strong> quanh bạn` : 'toàn khu vực quanh bạn';
            chuThich.innerHTML = `🎯 Đang quét trong ${txtBk}: Tìm thấy <strong>${soTrongPhamVi} gia sư</strong> trên bản đồ (${soSanSangDenNha} gia sư trong bán kính nhận dạy · bấm vào ghim hoặc cụm để phóng to xem chi tiết).`;
          } else {
            chuThich.innerHTML = `Đang hiển thị <strong>${soTrongPhamVi} gia sư</strong> dạy trực tiếp trên bản đồ. Khi thu nhỏ, các gia sư cùng khu vực được gom thành cụm (ẩn giá tiền để không rối mắt) — <strong>bấm vào cụm tỉnh/thành để phóng to</strong>.`;
          }
        }
      }

      async function napToanBoGiaSuChoBanDo(paramsGoc, dsTrangHienTai, tongSo) {
        if (tongSo <= dsTrangHienTai.length) {
          capNhatMarkerBanDo(dsTrangHienTai);
          return;
        }
        try {
          const paramsBanDo = new URLSearchParams(paramsGoc.toString());
          paramsBanDo.set('trang', '1');
          paramsBanDo.set('kichThuocTrang', '200');
          const resBanDo = await api.get(`/gia-su?${paramsBanDo.toString()}`);
          const dsFull = resBanDo?.duLieu || dsTrangHienTai;
          capNhatMarkerBanDo(dsFull);
        } catch {
          capNhatMarkerBanDo(dsTrangHienTai);
        }
      }

      function renderChipBoLoc() {
        const el = document.getElementById('khung-chip-loc');
        const chips = [];
        const tk = document.getElementById('loc-tu-khoa').value.trim();
        const mhId = document.getElementById('loc-mon-hoc').value;
        const ht = document.getElementById('loc-hinh-thuc').value;
        const kv = document.getElementById('loc-khu-vuc').value.trim();
        const gia = document.getElementById('loc-gia-toi-da').value;
        const xm = document.getElementById('loc-xac-minh').checked;
        const thu = document.getElementById('loc-hoc-thu').checked;

        if (ht === 'TRUC_TUYEN') chips.push({ nhan: 'Học trực tuyến (Toàn quốc)', xoa: () => capNhatGiaoDienTheoHinhThuc('') });
        if (ht === 'TRUC_TIEP') chips.push({ nhan: 'Học trực tiếp tại nhà', xoa: () => capNhatGiaoDienTheoHinhThuc('') });
        if (tk) chips.push({ nhan: `Từ khóa: ${tk}`, xoa: () => (document.getElementById('loc-tu-khoa').value = '') });
        if (mhId) {
          const tenMon = dsMonHoc.find((m) => m.id === mhId)?.ten || 'Môn học';
          chips.push({ nhan: `Môn: ${tenMon}`, xoa: () => (document.getElementById('loc-mon-hoc').value = '') });
        }
        if (kv && ht !== 'TRUC_TUYEN') chips.push({ nhan: `Khu vực: ${kv}`, xoa: () => (document.getElementById('loc-khu-vuc').value = '') });
        if (gia) chips.push({ nhan: `Tối đa ${dinhDangTienVnd(gia)}/h`, xoa: () => (document.getElementById('loc-gia-toi-da').value = '') });
        if (xm) chips.push({ nhan: 'Đã xác minh bằng cấp', xoa: () => (document.getElementById('loc-xac-minh').checked = false) });
        if (thu) chips.push({ nhan: 'Có buổi học thử', xoa: () => (document.getElementById('loc-hoc-thu').checked = false) });

        if (chips.length === 0) {
          el.style.display = 'none';
          el.innerHTML = '';
          return;
        }

        el.style.display = 'flex';
        el.innerHTML =
          '<span style="font-size: 0.78rem; color: var(--th-text-muted)">Đang lọc:</span>' +
          chips.map((c, i) => `<button type="button" class="filter-chip" data-idx="${i}">${escapeHtml(c.nhan)} <span>×</span></button>`).join('');

        el.querySelectorAll('.filter-chip').forEach((btn) => {
          btn.addEventListener('click', () => {
            chips[Number(btn.dataset.idx)].xoa();
            timKiem(1);
          });
        });
      }

      async function napMonHoc() {
        try {
          const res = await api.get('/mon-hoc');
          dsMonHoc = res?.duLieu || [];
          const sel = document.getElementById('loc-mon-hoc');
          const chonSan = urlParams.get('monHocId') || '';
          sel.innerHTML = taoOptionsNhomMonHocHtml(dsMonHoc, chonSan, `Tất cả môn học (${dsMonHoc.length})`, escapeHtml);

          const dlMon = document.getElementById('ds-mon-hoc-goi-y');
          if (dlMon) {
            dlMon.innerHTML = dsMonHoc.map((m) => `<option value="${escapeHtml(m.ten)}"></option>`).join('');
          }
        } catch {
          // Bỏ qua
        }
      }

      function docThamSoUrlVaoForm() {
        if (urlParams.get('tuKhoa')) document.getElementById('loc-tu-khoa').value = urlParams.get('tuKhoa');
        if (urlParams.get('khuVuc')) document.getElementById('loc-khu-vuc').value = urlParams.get('khuVuc');
        if (urlParams.get('giaToiDa')) document.getElementById('loc-gia-toi-da').value = urlParams.get('giaToiDa');
        if (urlParams.get('sapXep')) document.getElementById('loc-sap-xep').value = urlParams.get('sapXep');
        if (urlParams.get('chiDaXacMinh') === 'true') document.getElementById('loc-xac-minh').checked = true;
        if (urlParams.get('coHocThu') === 'true') document.getElementById('loc-hoc-thu').checked = true;
        dongBoBoLocNangCao();
        capNhatGiaoDienTheoHinhThuc(urlParams.get('hinhThuc') || '');
      }

      async function timKiem(trang = 1) {
        trangHienTai = trang;
        renderChipBoLoc();

        const params = new URLSearchParams();
        const tuKhoa = document.getElementById('loc-tu-khoa').value.trim();
        const monHocId = document.getElementById('loc-mon-hoc').value;
        const hinhThuc = document.getElementById('loc-hinh-thuc').value;
        const khuVuc = document.getElementById('loc-khu-vuc').value.trim();
        const giaToiDa = document.getElementById('loc-gia-toi-da').value;
        const sapXep = document.getElementById('loc-sap-xep').value;
        const chiDaXacMinh = document.getElementById('loc-xac-minh').checked;
        const coHocThu = document.getElementById('loc-hoc-thu').checked;

        if (tuKhoa) params.set('tuKhoa', tuKhoa);
        if (monHocId) params.set('monHocId', monHocId);
        if (hinhThuc) params.set('hinhThuc', hinhThuc);
        if (khuVuc && hinhThuc !== 'TRUC_TUYEN') params.set('khuVuc', khuVuc);
        if (giaToiDa) params.set('giaToiDa', giaToiDa);
        if (sapXep) params.set('sapXep', sapXep);
        if (chiDaXacMinh) params.set('chiDaXacMinh', 'true');
        if (coHocThu) params.set('coHocThu', 'true');
        if (viTriHienTaiToaDo && hinhThuc !== 'TRUC_TUYEN') {
          params.set('viDo', String(viTriHienTaiToaDo.lat));
          params.set('kinhDo', String(viTriHienTaiToaDo.lng));
          if (banKinhQuetKm > 0) params.set('banKinhQuetKm', String(banKinhQuetKm));
        }
        params.set('trang', String(trang));
        params.set('kichThuocTrang', '12');

        const khungKq = document.getElementById('khung-ket-qua');
        const moTa = document.getElementById('mo-ta-ket-qua');
        khungKq.innerHTML = taoSkeletonCardGiaSu(3);

        try {
          const res = await api.get(`/gia-su?${params.toString()}`);
          let ds = res?.duLieu || [];
          const meta = res?.meta || { trang: 1, kichThuocTrang: 12, tong: ds.length, tongTrang: 1 };

          if (viTriHienTaiToaDo) {
            ds.forEach((gs) => {
              if (gs.coDayTrucTiep && typeof gs.viDoMo === 'number' && typeof gs.kinhDoMo === 'number') {
                const d = tinhKhoangCachKm(viTriHienTaiToaDo.lat, viTriHienTaiToaDo.lng, gs.viDoMo, gs.kinhDoMo);
                gs._khoangCachKm = d;
                gs._sanSangDenNha = d <= (gs.banKinhPhucVuKm || 10);
              }
            });
          }

          dsGiaSuHienTai = ds;

          const nhanCheDo =
            hinhThuc === 'TRUC_TUYEN'
              ? 'học trực tuyến toàn quốc'
              : hinhThuc === 'TRUC_TIEP'
                ? 'học trực tiếp tại nhà'
                : 'phù hợp';

          const tongSo = typeof meta.tong === 'number' ? meta.tong : ds.length;
          const tuIdx = tongSo === 0 ? 0 : (meta.trang - 1) * (meta.kichThuocTrang || 12) + 1;
          const denIdx = tuIdx === 0 ? 0 : tuIdx + ds.length - 1;
          const chuThichTrang = meta.tongTrang > 1 ? ` · Hiển thị ${tuIdx}–${denIdx} (Trang ${meta.trang}/${meta.tongTrang})` : '';

          if (viTriHienTaiToaDo && banKinhQuetKm > 0 && hinhThuc !== 'TRUC_TUYEN') {
            moTa.innerHTML = `🎯 Tìm thấy <strong>${tongSo} gia sư</strong> trong phạm vi <strong>${banKinhQuetKm} km</strong> quanh bạn${chuThichTrang}`;
          } else {
            moTa.textContent = `Tìm thấy ${tongSo} gia sư ${nhanCheDo}${chuThichTrang}`;
          }

          capNhatGiaoDienPhamViQuet(tongSo);

          // Danh sách thẻ bên dưới vẫn phân trang 12 gia sư/trang chống nghẽn DOM, còn Bản đồ nạp toàn bộ tọa độ gia sư phù hợp để gom cụm theo Tỉnh/Khu vực
          if (hinhThuc !== 'TRUC_TUYEN') {
            napToanBoGiaSuChoBanDo(params, ds, tongSo);
          }

          if (ds.length === 0) {
            const buocTiep = layBuocPhamViTiepTheo(banKinhQuetKm);
            const nutMoRongKhiTrong =
              viTriHienTaiToaDo && buocTiep !== null
                ? `<button type="button" class="btn btn-primary btn-sm" id="btn-mo-rong-khi-trong" style="margin-top: 0.85rem; font-weight: 700">
                     🔍 Tìm thêm gia sư ở xa hơn (Tự động mở rộng lên ${buocTiep === 0 ? 'Toàn khu vực' : `${buocTiep} km`}) →
                   </button>`
                : '';
            khungKq.innerHTML = `
              <div class="card" style="grid-column: 1 / -1; text-align: center; padding: 2.5rem">
                <div style="font-weight: 700; font-size: 1rem">Chưa tìm thấy gia sư phù hợp trong phạm vi ${banKinhQuetKm} km này</div>
                <p style="margin: 0.35rem 0 0; font-size: 0.86rem; color: var(--th-text-muted)">
                  Bạn có thể bấm nút bên dưới để tự động mở rộng phạm vi tìm kiếm ra xa hơn, hoặc chuyển sang hình thức Học trực tuyến toàn quốc.
                </p>
                ${nutMoRongKhiTrong}
              </div>
            `;
            document.getElementById('btn-mo-rong-khi-trong')?.addEventListener('click', moRongPhamViTimKiem);
            document.getElementById('khung-phan-trang').innerHTML = '';
            return;
          }

          khungKq.innerHTML = ds.map((gs) => renderCardGiaSu(gs)).join('');
          ganSuKienYeuThich(khungKq);
          renderPhanTrang(meta);
        } catch (err) {
          khungKq.innerHTML = `<div class="alert alert-danger" style="grid-column: 1 / -1">${escapeHtml(err.message)}</div>`;
        }
      }

      function renderPhanTrang(meta) {
        const el = document.getElementById('khung-phan-trang');
        if (!meta || meta.tongTrang <= 1) {
          el.innerHTML = '';
          return;
        }
        const cur = meta.trang;
        const total = meta.tongTrang;
        const pages = [];
        const add = (p) => { if (!pages.includes(p)) pages.push(p); };
        add(1);
        for (let p = Math.max(2, cur - 2); p <= Math.min(total - 1, cur + 2); p++) add(p);
        if (total > 1) add(total);
        pages.sort((a, b) => a - b);

        let html = `<button type="button" class="btn btn-sm btn-secondary" data-trang="${cur - 1}" ${cur <= 1 ? 'disabled' : ''}>‹ Trước</button>`;
        let prev = 0;
        for (const p of pages) {
          if (prev && p - prev > 1) {
            html += `<span style="padding: 0 0.35rem; color: var(--th-text-muted); align-self: center">…</span>`;
          }
          html += `<button type="button" class="btn btn-sm ${p === cur ? 'btn-primary' : 'btn-secondary'}" data-trang="${p}">${p}</button>`;
          prev = p;
        }
        html += `<button type="button" class="btn btn-sm btn-secondary" data-trang="${cur + 1}" ${cur >= total ? 'disabled' : ''}>Sau ›</button>`;
        html += `<span style="font-size: 0.8rem; color: var(--th-text-muted); margin-left: 0.45rem; align-self: center">Trang ${cur}/${total} (${meta.tong} gia sư)</span>`;

        el.innerHTML = html;
        el.querySelectorAll('button[data-trang]').forEach((b) => {
          b.addEventListener('click', () => {
            const p = Number(b.dataset.trang);
            if (p >= 1 && p <= total && p !== cur) {
              timKiem(p);
              document.getElementById('mo-ta-ket-qua')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          });
        });
      }

      function ganSuKienYeuThich(container) {
        container.querySelectorAll('.btn-yeu-thich').forEach((btn) => {
          btn.addEventListener('click', async (ev) => {
            ev.preventDefault();
            ev.stopPropagation();
            const user = layNguoiDungHienTai();
            if (!user) {
              window.location.href = '/pages/dang-nhap.html';
              return;
            }
            if (user.vaiTro !== 'HOC_SINH') {
              hienToast('Chỉ tài khoản Học sinh mới có thể lưu gia sư yêu thích.', 'warning');
              return;
            }
            const giaSuId = btn.dataset.giaSuId;
            const daYeuThich = btn.dataset.daYeuThich === 'true';
            try {
              if (daYeuThich) {
                await api.delete(`/muc-yeu-thich/${giaSuId}`);
                btn.dataset.daYeuThich = 'false';
                btn.innerHTML = icons.heart(17, false);
              } else {
                await api.post(`/muc-yeu-thich/${giaSuId}`, {});
                btn.dataset.daYeuThich = 'true';
                btn.innerHTML = icons.heart(17, true);
              }
            } catch (err) {
              hienToast(err.message || 'Không thể cập nhật yêu thích.', 'danger');
            }
          });
        });
      }

      document.querySelectorAll('.mode-pill').forEach((btn) => {
        btn.addEventListener('click', () => {
          capNhatGiaoDienTheoHinhThuc(btn.dataset.mode || '');
          timKiem(1);
        });
      });

      const btnMoLocMobile = document.getElementById('btn-mo-loc-mobile');
      const formBoLoc = document.getElementById('form-bo-loc');
      if (btnMoLocMobile) {
        btnMoLocMobile.innerHTML = `${icons.sliders(14)} <span>Bộ lọc</span>`;
        btnMoLocMobile.addEventListener('click', () => {
          const dangMo = formBoLoc?.classList.toggle('mobile-filters-open');
          btnMoLocMobile.setAttribute('aria-expanded', String(Boolean(dangMo)));
          if (dangMo && window.innerWidth <= 680) {
            dangMoNangCao = true;
            dongBoBoLocNangCao();
          }
        });
      }

      document.getElementById('btn-loc-nang-cao')?.addEventListener('click', () => {
        dangMoNangCao = !dangMoNangCao;
        dongBoBoLocNangCao();
      });

      document.getElementById('btn-xem-danh-sach')?.addEventListener('click', () => {
        cheDoXem = 'danh_sach';
        dongBoCheDoXem();
      });

      document.getElementById('btn-xem-ban-do')?.addEventListener('click', () => {
        cheDoXem = 'ban_do';
        dongBoCheDoXem();
      });

      document.getElementById('form-bo-loc')?.addEventListener('submit', (e) => {
        e.preventDefault();
        formBoLoc?.classList.remove('mobile-filters-open');
        btnMoLocMobile?.setAttribute('aria-expanded', 'false');
        timKiem(1);
      });

      document.getElementById('btn-mo-rong-ban-kinh')?.addEventListener('click', moRongPhamViTimKiem);
      document.getElementById('btn-thu-hep-ban-kinh')?.addEventListener('click', thuHepVeGanToi);
      document.getElementById('btn-xem-toan-canh-ban-do')?.addEventListener('click', canKhungToanBoGiaSu);

      document.getElementById('btn-dat-lai')?.addEventListener('click', () => {
        document.getElementById('form-bo-loc').reset();
        viTriHienTaiToaDo = null;
        banKinhQuetKm = 4;
        lopViTriBanThan?.clearLayers();
        capNhatGiaoDienPhamViQuet();
        cheDoXem = 'danh_sach';
        capNhatGiaoDienTheoHinhThuc('');
        timKiem(1);
      });

      document.getElementById('btn-tim-quanh-day')?.addEventListener('click', kichHoatTimQuanhDay);
      document.getElementById('btn-gps-loc-nhanh')?.addEventListener('click', kichHoatTimQuanhDay);

      capNhatGiaoDienPhamViQuet();
      await napMonHoc();
      docThamSoUrlVaoForm();
      await timKiem(trangHienTai);
    </script>
  </body>
</html>
